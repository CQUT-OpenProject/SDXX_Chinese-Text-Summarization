[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-text-summarization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.46,<5", "datasets>=2.19,<4", "accelerate>=0.26", "sentencepiece>=0.2"]

[project.scripts]
summarizer = "summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
